
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJECT ZEROX | Commands</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #000;
    --panel: #090909;
    --panel2: #101010;
    --border: #222;
    --text: #f5f5f5;
    --muted: #858585;
}

html {
    scroll-behavior: smooth;
}

body {
    background:
        radial-gradient(ellipse at 50% -20%, rgba(90,90,90,.13), transparent 55%),
        #000;
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
}

/* AMBIENT BACKGROUND */

body::before {
    content: "";
    position: fixed;
    inset: -30%;
    pointer-events: none;
    z-index: 0;
    background:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,.035), transparent 25%),
        radial-gradient(circle at 80% 65%, rgba(120,120,120,.035), transparent 30%);
    animation: ambientMove 16s ease-in-out infinite alternate;
}

@keyframes ambientMove {
    from { transform: translate(-2%, -1%) scale(1); }
    to { transform: translate(2%, 2%) scale(1.08); }
}

header, main, footer {
    position: relative;
    z-index: 1;
}

/* SCROLLBAR */

::-webkit-scrollbar {
    width: 7px;
}

::-webkit-scrollbar-track {
    background: #000;
}

::-webkit-scrollbar-thumb {
    background: #292929;
    border-radius: 20px;
}

::-webkit-scrollbar-thumb:hover {
    background: #555;
}

/* NAVBAR */

header {
    height: 78px;
    padding: 0 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,.94);
    position: sticky;
    top: 0;
    z-index: 10;
    backdrop-filter: blur(15px);
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
    transition: .3s;
}

.logo {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 2px;
    transition: .35s ease;
}

.logo:hover {
    transform: translateY(-2px);
    filter: drop-shadow(0 0 9px rgba(255,255,255,.2));
}

.logo .project {
    color: #f5f5f5;
}

.logo .zerox {
    background: linear-gradient(90deg, #666, #fff, #777, #666);
    background-size: 200% auto;
    color: transparent;
    background-clip: text;
    -webkit-background-clip: text;
    animation: logoShine 5s linear infinite;
}

@keyframes logoShine {
    to { background-position: 200% center; }
}

nav {
    display: flex;
    gap: 30px;
}

nav a {
    position: relative;
    color: #888;
    text-decoration: none;
    font-size: 13px;
    transition: color .3s ease;
}

nav a:hover,
nav a.active {
    color: white;
}

nav a::after {
    content: "";
    position: absolute;
    bottom: -8px;
    left: 0;
    width: 0;
    height: 1px;
    background: #fff;
    transition: width .3s ease;
}

nav a:hover::after,
nav a.active::after {
    width: 100%;
}

/* MAIN */

.container {
    max-width: 1200px;
    margin: auto;
    padding: 75px 25px;
}

.heading {
    margin-bottom: 38px;
    animation: fadeUp .8s ease both;
}

.heading small {
    color: #777;
    letter-spacing: 4px;
    font-size: 10px;
    text-transform: uppercase;
}

.heading h1 {
    font-size: clamp(38px, 6vw, 60px);
    letter-spacing: -2px;
    margin: 15px 0;
    text-shadow: 0 0 35px rgba(255,255,255,.09);
    animation: titleAppear 1s ease both;
}

.heading p {
    color: var(--muted);
    line-height: 1.8;
    font-size: 14px;
    max-width: 550px;
}

.heading-line {
    width: 65px;
    height: 2px;
    background: #555;
    margin-top: 25px;
    position: relative;
    overflow: hidden;
}

.heading-line::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, #fff, transparent);
    animation: lineShine 3s ease-in-out infinite;
}

@keyframes lineShine {
    0% { transform: translateX(-100%); }
    60%, 100% { transform: translateX(150%); }
}

@keyframes titleAppear {
    from {
        opacity: 0;
        letter-spacing: 5px;
        filter: blur(7px);
    }
    to {
        opacity: 1;
        letter-spacing: -2px;
        filter: blur(0);
    }
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(18px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* SEARCH */

.search-area {
    margin-bottom: 30px;
    position: relative;
    animation: fadeUp .8s .1s ease both;
}

.search-area input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 18px 20px 18px 48px;
    color: white;
    outline: none;
    font-size: 13px;
    transition: all .35s ease;
}

.search-area input:focus {
    border-color: #666;
    background: #0c0c0c;
    box-shadow:
        0 0 0 3px rgba(255,255,255,.035),
        0 0 25px rgba(255,255,255,.045);
    transform: translateY(-2px);
}

.search-icon {
    position: absolute;
    left: 19px;
    top: 50%;
    transform: translateY(-50%);
    color: #777;
    font-size: 17px;
    transition: .3s ease;
}

.search-area:focus-within .search-icon {
    color: white;
    transform: translateY(-50%) scale(1.15);
}

/* LAYOUT */

.layout {
    display: grid;
    grid-template-columns: 235px 1fr;
    gap: 25px;
    animation: fadeUp .8s .15s ease both;
}

/* SIDEBAR */

.sidebar {
    height: fit-content;
    background: rgba(9,9,9,.92);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 20px 13px;
    position: sticky;
    top: 100px;
    box-shadow: 0 10px 35px rgba(0,0,0,.3);
}

.sidebar-title {
    color: #666;
    font-size: 10px;
    letter-spacing: 2px;
    margin: 3px 10px 17px;
    text-transform: uppercase;
}

.category {
    width: 100%;
    border: 1px solid transparent;
    background: transparent;
    color: #999;
    text-align: left;
    padding: 13px 12px;
    border-radius: 7px;
    cursor: pointer;
    margin-bottom: 5px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 11px;
    position: relative;
    overflow: hidden;
    transition: all .3s cubic-bezier(.2,.8,.2,1);
}

.category-icon {
    color: #777;
    font-size: 15px;
    width: 19px;
    text-align: center;
    transition: .3s ease;
}

.category:hover {
    transform: translateX(4px);
    background: #151515;
    border-color: #292929;
    color: white;
}

.category:hover .category-icon {
    transform: scale(1.2);
    color: white;
}

.category.selected {
    background: #171717;
    border-color: #292929;
    color: white;
    box-shadow: inset 0 0 20px rgba(255,255,255,.025);
}

.category.selected .category-icon {
    color: white;
}

.category::before {
    content: "";
    position: absolute;
    left: 0;
    top: 20%;
    width: 2px;
    height: 60%;
    background: white;
    opacity: 0;
    transform: scaleY(.3);
    transition: .3s ease;
}

.category.selected::before {
    opacity: 1;
    transform: scaleY(1);
}

/* COMMAND CONTENT */

.content {
    min-width: 0;
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 19px;
    padding-bottom: 15px;
    border-bottom: 1px solid var(--border);
}

.section-title h2 {
    font-size: 18px;
    font-weight: 700;
}

.count {
    color: #777;
    font-size: 11px;
}

.command-list {
    display: flex;
    flex-direction: column;
    gap: 11px;
}

/* COMMAND CARDS */

.command {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 9px;
    overflow: hidden;
    position: relative;
    animation: cardAppear .45s ease both;
    transition:
        transform .3s ease,
        border-color .3s ease,
        background .3s ease,
        box-shadow .3s ease;
}

.command:nth-child(2) { animation-delay: .035s; }
.command:nth-child(3) { animation-delay: .07s; }
.command:nth-child(4) { animation-delay: .105s; }
.command:nth-child(5) { animation-delay: .14s; }
.command:nth-child(6) { animation-delay: .175s; }

@keyframes cardAppear {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.command:hover {
    transform: translateY(-3px);
    border-color: #505050;
    background: #0b0b0b;
    box-shadow:
        0 8px 25px rgba(0,0,0,.5),
        0 0 18px rgba(255,255,255,.025);
}

.command.open {
    border-color: #444;
    background: #080808;
}

.command-top {
    width: 100%;
    padding: 19px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    background: transparent;
    border: none;
    color: white;
    text-align: left;
    cursor: pointer;
}

.command-info {
    display: flex;
    align-items: center;
    gap: 15px;
}

.command-symbol {
    width: 39px;
    height: 39px;
    display: grid;
    place-items: center;
    background: #141414;
    border: 1px solid #292929;
    border-radius: 8px;
    color: #aaa;
    font-size: 16px;
    flex-shrink: 0;
    transition: all .35s ease;
}

.command:hover .command-symbol {
    color: white;
    border-color: #555;
    background: #1b1b1b;
    box-shadow: 0 0 16px rgba(255,255,255,.06);
    transform: rotate(-5deg) scale(1.06);
}

.command-name {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .3px;
}

.command-desc {
    color: #777;
    font-size: 11px;
    margin-top: 6px;
    line-height: 1.5;
}

.command-right {
    display: flex;
    align-items: center;
    gap: 14px;
}

.command-type {
    color: #888;
    background: #121212;
    border: 1px solid #292929;
    padding: 5px 8px;
    border-radius: 4px;
    font-size: 9px;
    letter-spacing: .7px;
    transition: .25s ease;
}

.command:hover .command-type {
    border-color: #555;
    color: white;
}

.arrow {
    color: #777;
    font-size: 17px;
    transition: transform .35s cubic-bezier(.2,.8,.2,1);
}

.command.open .arrow {
    transform: rotate(180deg);
    color: white;
}

/* DETAILS */

.command-details {
    display: none;
    padding: 22px;
    border-top: 1px solid var(--border);
    background: #050505;
}

.command.open .command-details {
    display: block;
    animation: detailsAppear .35s ease both;
}

@keyframes detailsAppear {
    from {
        opacity: 0;
        transform: translateY(-8px);
        filter: blur(3px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
    }
}

.detail-block {
    margin-bottom: 20px;
}

.detail-block:last-child {
    margin-bottom: 0;
}

.detail-block h4 {
    color: #777;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-size: 10px;
    margin-bottom: 10px;
}

.detail-block p {
    color: #bbb;
    font-size: 12px;
    line-height: 1.8;
}

.variants {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.variant {
    background: #111;
    border: 1px solid #292929;
    padding: 9px 12px;
    border-radius: 5px;
    color: #ddd;
    font-family: Consolas, monospace;
    font-size: 11px;
    transition: all .25s ease;
}

.variant:hover {
    color: white;
    border-color: #666;
    background: #1a1a1a;
    transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(255,255,255,.04);
}

.example {
    background: #101010;
    border: 1px solid #242424;
    padding: 13px;
    border-radius: 6px;
    color: #ddd;
    font-family: Consolas, monospace;
    font-size: 12px;
    overflow-wrap: anywhere;
}

.permission-tag {
    display: inline-block;
    border: 1px solid #292929;
    background: #101010;
    color: #aaa;
    border-radius: 5px;
    padding: 7px 10px;
    font-size: 10px;
}

/* EMPTY SEARCH */

.empty {
    padding: 55px 20px;
    border: 1px dashed #292929;
    border-radius: 9px;
    text-align: center;
    color: #777;
    font-size: 13px;
}

.empty strong {
    display: block;
    font-size: 20px;
    color: #aaa;
    margin-bottom: 10px;
}

/* FOOTER */

footer {
    border-top: 1px solid var(--border);
    padding: 35px 20px;
    text-align: center;
    color: #555;
    font-size: 11px;
    letter-spacing: 1px;
    position: relative;
    overflow: hidden;
}

.footer-logo {
    color: #aaa;
    margin-bottom: 10px;
    font-weight: 800;
    letter-spacing: 3px;
    transition: .3s ease;
}

.footer-logo:hover {
    color: white;
    letter-spacing: 5px;
    text-shadow: 0 0 15px rgba(255,255,255,.2);
}

/* RESPONSIVE */

@media(max-width: 760px) {
    header {
        padding: 0 18px;
    }

    .logo {
        font-size: 14px;
        gap: 8px;
    }

    nav {
        gap: 13px;
    }

    nav a {
        font-size: 11px;
    }

    .container {
        padding: 45px 16px;
    }

    .layout {
        grid-template-columns: 1fr;
    }

    .sidebar {
        position: static;
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
    }

    .sidebar-title {
        width: 100%;
    }

    .category {
        width: auto;
        margin: 0;
        padding: 10px;
    }

    .command-top {
        padding: 15px;
    }

    .command-symbol {
        width: 34px;
        height: 34px;
    }

    .command-type {
        display: none;
    }
}

/* REDUCED MOTION */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
    }
}
</style>
</head>

/* CATEGORY SETTINGS */

const categoryNames = {
all: "Todos los comandos",
moderation: "Moderación & Seguridad",
automessages: "Sistemas automáticos",
fun: "Diversión & Interacción",
marry: "Matrimonios",
utility: "Utilidad & Configuración",
info: "Información"
};

let activeCategory = "all";

const list = document.getElementById("commandList");
const search = document.getElementById("search");
const count = document.getElementById("count");
const title = document.getElementById("categoryTitle");

/* DETAIL BUILDER */

function makeDetail(label, value, isCode = false, isTag = false) {
    const block = document.createElement("div");
    block.className = "detail-block";

    const heading = document.createElement("h4");
    heading.textContent = label;

    const content = document.createElement(isCode ? "div" : "p");

    if (isCode) content.className = "example";
    if (isTag) content.className = "permission-tag";

    content.textContent = value;
    block.append(heading, content);

    return block;
}

/* RENDER COMMANDS */

function renderCommands() {
    const query = search.value.toLowerCase().trim();

    const filtered = commands.filter(command => {
        const categoryMatch =
            activeCategory === "all" ||
            command.category === activeCategory;

        const searchMatch =
            command.name.toLowerCase().includes(query) ||
            command.description.toLowerCase().includes(query) ||
            command.variants.join(" ").toLowerCase().includes(query);

        return categoryMatch && searchMatch;
    });

    title.textContent = categoryNames[activeCategory];
    count.textContent = filtered.length + " comandos";

    list.innerHTML = "";

    if (filtered.length === 0) {
        list.innerHTML = `
            <div class="empty">
                <strong>⌕</strong>
                No se encontraron comandos.
                <br>Prueba con otra búsqueda.
            </div>
        `;
        return;
    }

    filtered.forEach(command => {
        const item = document.createElement("article");
        item.className = "command";

        const top = document.createElement("button");
        top.className = "command-top";
        top.type = "button";

        const info = document.createElement("div");
        info.className = "command-info";

        const symbol = document.createElement("div");
        symbol.className = "command-symbol";
        symbol.textContent = command.symbol;

        const text = document.createElement("div");

        const name = document.createElement("div");
        name.className = "command-name";
        name.textContent = command.name;

        const desc = document.createElement("div");
        desc.className = "command-desc";
        desc.textContent = command.description;

        text.append(name, desc);
        info.append(symbol, text);

        const right = document.createElement("div");
        right.className = "command-right";

        const type = document.createElement("span");
        type.className = "command-type";
        type.textContent = command.variants.every(v => v.startsWith("/"))
            ? "SLASH"
            : "PREFIX + SLASH";

        const arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.textContent = "⌄";

        right.append(type, arrow);
        top.append(info, right);

        const details = document.createElement("div");
        details.className = "command-details";

        const variantBlock = document.createElement("div");
        variantBlock.className = "detail-block";

        const variantHeading = document.createElement("h4");
        variantHeading.textContent = "Variantes disponibles";

        const variants = document.createElement("div");
        variants.className = "variants";

        command.variants.forEach(variant => {
            const code = document.createElement("span");
            code.className = "variant";
            code.textContent = variant;
            variants.appendChild(code);
        });

        variantBlock.append(variantHeading, variants);

        details.append(
            variantBlock,
            makeDetail("Cómo utilizarlo", command.usage),
            makeDetail("Descripción", command.detail),
            makeDetail("Ejemplo", command.example, true),
            makeDetail("Permisos", command.permission, false, true)
        );

        top.addEventListener("click", () => {
            item.classList.toggle("open");
        });

        item.append(top, details);
        list.appendChild(item);
    });
}

/* CATEGORY FILTER */

document.querySelectorAll(".category").forEach(button => {
    button.addEventListener("click", () => {
        document.querySelectorAll(".category").forEach(item => {
            item.classList.remove("selected");
        });

        button.classList.add("selected");
        activeCategory = button.dataset.category;

        renderCommands();
    });
});

/* SEARCH */

search.addEventListener("input", renderCommands);

/* INITIALIZE */

renderCommands();

</script>
